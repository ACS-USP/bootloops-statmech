integralfamilies:
  - name: "moeller"
    loop_momenta: [k1, k2]
    top_level_sectors: [127]
    propagators:
      - ["k1-p1", "m2"]
      - ["k1-p1-p2", 0]
      - ["k1", 0]
      - ["k1+k2", "m2"]
      - ["k2+p1+p2", 0]
      - ["k2", 0]
      - ["k2+p1+p2+p3", "m2"]
      - ["k1-p1-p3", 0]
      - ["k2+p1+p3", 0]
